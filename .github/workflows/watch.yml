name: watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      notify_first:
        description: "出勤日通知のテスト(1で、今出ている日も通知。初回のみ)"
        default: "0"
      debug:
        description: "空きチェックの詳細ログ(1で有効)"
        default: "0"
      cast_ids:
        description: "空きチェックの監視ID。空なら登録済みのIDを使用"
        default: ""
permissions:
  contents: write
concurrency: watch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 新しい予約ボタン(出勤日)の通知
        run: python monitor.py
        env:
          CAST_IDS: ${{ secrets.CAST_IDS }}
          NOTIFY_FIRST: ${{ github.event.inputs.notify_first || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: 時間表の空き(○)の通知
        continue-on-error: true
        run: python monitor_slots.py
        env:
          CAST_IDS: ${{ github.event.inputs.cast_ids || secrets.CAST_IDS }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_dates.json state.json || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
